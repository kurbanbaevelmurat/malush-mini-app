<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Malush Desserts</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Шапка -->
    <header class="header">
      <button class="back-btn hidden" id="backBtn" aria-label="Назад">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand">
        <span class="brand-logo">🧁</span>
        <div>
          <h1 class="brand-title" id="pageTitle">Malush Desserts</h1>
          <p class="brand-subtitle" id="pageSubtitle">Домашние десерты с любовью</p>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- Экран категорий -->
      <section class="screen active" id="categoriesScreen">
        <div class="hero">
          <p class="hero-greeting" id="greeting">Добро пожаловать!</p>
          <h2 class="hero-title">Что порадует вас сегодня?</h2>
        </div>
        <div class="categories" id="categoriesList"></div>
      </section>

      <!-- Экран товаров -->
      <section class="screen" id="productsScreen">
        <div class="products" id="productsList"></div>
      </section>
    </main>

    <!-- Нижняя панель корзины -->
    <footer class="cart-bar" id="cartBar">
      <div class="cart-info">
        <div class="cart-icon">
          🛒
          <span class="cart-badge" id="cartCount">0</span>
        </div>
        <div class="cart-text">
          <span class="cart-label" id="cartLabel">Корзина пуста</span>
          <span class="cart-total" id="cartTotal">0 ₽</span>
        </div>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled>Оформить заказ</button>
    </footer>

    <!-- Всплывающее уведомление -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
